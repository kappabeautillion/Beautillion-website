# Decap CMS configuration for the Beautillion Leadership Academy website.
#
# IMPORTANT — before this works, you must:
#   1. Replace `repo:` below with your actual GitHub "username/repo-name".
#   2. Replace `base_url:` with your live site URL (custom domain once connected,
#      or the vercel.app URL in the meantime).
#   3. Follow the "Setting up committee editing (Decap CMS)" section of README.md
#      to create a GitHub OAuth App and add its credentials to Vercel.
#
# Everything below this point should NOT need to change for day-to-day editing.

backend:
  name: github
  repo: YOUR_GITHUB_USERNAME/beautillion-website
  branch: main
  base_url: https://www.kappabeautillion.com
  auth_endpoint: api/auth

media_folder: "content/uploads"
public_folder: "/content/uploads"

collections:
  - name: "home"
    label: "Home Page"
    files:
      - file: "content/home.json"
        label: "Home Page Content"
        name: "home"
        fields:
          - label: "Hero Banner"
            name: "hero"
            widget: "object"
            fields:
              - { label: "Small Text Above Headline", name: "eyebrow", widget: "string" }
              - { label: "Main Headline", name: "headline", widget: "string" }
              - { label: "Supporting Sentence", name: "sub", widget: "text" }
          - label: "Mission Section"
            name: "mission"
            widget: "object"
            fields:
              - { label: "Small Text Above Headline", name: "eyebrow", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Paragraph", name: "body", widget: "text" }

  - name: "apply"
    label: "Apply Page"
    files:
      - file: "content/apply.json"
        label: "Apply Page"
        name: "apply"
        fields:
          - label: "Eligibility Details"
            name: "eligibility"
            widget: "object"
            hint: "Shown in the quick-facts strip on the Apply page."
            fields:
              - { label: "Eligible Grade Levels", name: "grade_levels", widget: "string" }
              - { label: "Eligible Graduating Classes", name: "graduating_classes", widget: "string" }
              - { label: "Geographic Eligibility", name: "geographic_eligibility", widget: "string", required: false }
              - { label: "Minimum Academic Expectation", name: "minimum_academic", widget: "string", required: false }
              - { label: "Application Deadline", name: "application_deadline", widget: "string" }
              - { label: "Interview Period", name: "interview_period", widget: "string" }
              - { label: "Program Start", name: "program_start", widget: "string" }
              - { label: "Program End", name: "program_end", widget: "string" }
          - label: "Eligibility Checklist"
            name: "requirements"
            widget: "list"
            hint: "One requirement per line."
          - label: "Notice — Requirements May Vary by Class"
            name: "requirements_notice"
            widget: "text"
          - label: "Notice — Public Profile Information"
            name: "profile_notice"
            widget: "text"
          - label: "Applicant Short-Response Prompts"
            name: "essays"
            widget: "list"
            summary: "{{label}} ({{limit}} words)"
            fields:
              - { label: "ID (no spaces, do not change once applicants start applying)", name: "id", widget: "string" }
              - { label: "Prompt Label", name: "label", widget: "string" }
              - { label: "Prompt", name: "prompt", widget: "text" }
              - { label: "Word Limit", name: "limit", widget: "number" }
          - label: "Applicant Acknowledgements (Step 8)"
            name: "applicant_acknowledgements"
            widget: "list"
            summary: "{{text}}"
            fields:
              - { label: "ID (no spaces, do not change once applicants start applying)", name: "id", widget: "string" }
              - { label: "Acknowledgement Text", name: "text", widget: "text" }
              - { label: "Required?", name: "required", widget: "boolean", default: true }
          - label: "Parent/Guardian Acknowledgements (Step 8)"
            name: "guardian_acknowledgements"
            widget: "list"
            summary: "{{text}}"
            fields:
              - { label: "ID (no spaces, do not change once applicants start applying)", name: "id", widget: "string" }
              - { label: "Acknowledgement Text", name: "text", widget: "text" }
              - { label: "Required?", name: "required", widget: "boolean", default: true }
          - label: "Media Authorization (separate from acknowledgements)"
            name: "media_authorization"
            widget: "object"
            fields:
              - { label: "Authorization Text", name: "text", widget: "text" }
              - { label: "Required?", name: "required", widget: "boolean", default: false }

  - name: "news"
    label: "News Posts"
    files:
      - file: "content/news.json"
        label: "News Posts"
        name: "news"
        fields:
          - label: "Posts"
            name: "posts"
            widget: "list"
            summary: "{{title}}"
            fields:
              - { label: "Headline", name: "title", widget: "string" }
              - { label: "URL Slug (no spaces, e.g. spring-gala-recap)", name: "slug", widget: "string" }
              - { label: "Date", name: "date", widget: "date" }
              - { label: "Category (e.g. Announcement, Impact, Service)", name: "category", widget: "string" }
              - { label: "Short Summary (shown in previews)", name: "excerpt", widget: "text" }
              - { label: "Full Story", name: "body", widget: "text" }
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Photo Description (shown until a photo is uploaded)", name: "image_label", widget: "string" }

  - name: "alumni"
    label: "Alumni — The Legacy Continues"
    files:
      - file: "content/alumni.json"
        label: "Alumni Page"
        name: "alumni"
        fields:
          - label: "The Academy's Impact (animated counters)"
            name: "impact_stats"
            widget: "list"
            summary: "{{label}}: {{value}}"
            fields:
              - { label: "Number", name: "value", widget: "number" }
              - { label: "Symbol Before the Number (e.g. $)", name: "prefix", widget: "string", required: false }
              - { label: "Symbol After the Number (e.g. +, %, M+)", name: "suffix", widget: "string", required: false }
              - { label: "Label", name: "label", widget: "string" }

          - label: "Featured Alumni"
            name: "alumni"
            widget: "list"
            summary: "{{name}} — Class of {{class_year}}"
            hint: "Each alumnus gets their own page at /alumni/their-slug/. Set 'Feature on Homepage Spotlight' for only a handful at a time — those get the large magazine-style treatment; everyone else still gets a full profile page, reachable from the industry directory, milestones, and news."
            fields:
              - { label: "Full Name", name: "name", widget: "string" }
              - { label: "URL Slug (no spaces, e.g. john-smith)", name: "slug", widget: "string" }
              - { label: "Academy Class Year", name: "class_year", widget: "string" }
              - { label: "Academy Class Theme", name: "theme", widget: "string", hint: "e.g. Heirs to the Throne — should match the class's theme on the Beaux Legacy Archive." }
              - { label: "Feature on Homepage Spotlight?", name: "featured", widget: "boolean", default: false }
              - label: "Field / Industry"
                name: "industry"
                widget: "select"
                options:
                  - { label: "Law", value: "law" }
                  - { label: "Medicine", value: "medicine" }
                  - { label: "Public Service", value: "public-service" }
                  - { label: "Education", value: "education" }
                  - { label: "Business", value: "business" }
                  - { label: "Technology", value: "technology" }
                  - { label: "Engineering", value: "engineering" }
                  - { label: "Military", value: "military" }
                  - { label: "Arts", value: "arts" }
                  - { label: "Athletics", value: "athletics" }
              - { label: "Current Position", name: "current_position", widget: "string" }
              - { label: "Employer", name: "employer", widget: "string", required: false }
              - { label: "College", name: "college", widget: "string" }
              - { label: "Graduate School", name: "grad_school", widget: "string", required: false }
              - label: "Volunteer Status"
                name: "volunteer_status"
                widget: "select"
                options: ["Active Mentor", "Occasional Volunteer", "Not Currently Involved"]
              - { label: "Portrait", name: "photo", widget: "image", required: false }
              - { label: "Portrait Description (shown until a photo is uploaded)", name: "photo_label", widget: "string" }
              - { label: "Short Bio (one sentence, used in card previews)", name: "bio", widget: "text" }
              - label: "Full Story (magazine-style, one paragraph per entry)"
                name: "story"
                widget: "list"
                field: { label: "Paragraph", name: "paragraph", widget: "text" }
              - { label: "Advice to Future Participants", name: "advice", widget: "text" }
              - label: "Gallery"
                name: "gallery"
                widget: "list"
                required: false
                summary: "{{caption}}"
                fields:
                  - { label: "Photo", name: "image", widget: "image", required: false }
                  - { label: "Caption", name: "caption", widget: "string", required: false }
              - label: "Related News (must match a News Story's slug below)"
                name: "related_news"
                widget: "list"
                required: false
                field: { label: "News Story Slug", name: "slug", widget: "string" }

          - label: "Milestones (life-after-the-Academy timeline)"
            name: "milestones"
            widget: "list"
            summary: "{{label}} — {{alumni_slug}}"
            fields:
              - { label: "Icon (emoji)", name: "icon", widget: "string" }
              - { label: "Milestone Type", name: "label", widget: "string", hint: "e.g. College Graduation, Law School, Military Commission, Promotion, Entrepreneurship, Community Award, Published Author, Board Service, Family, Leadership Position" }
              - { label: "Alumnus URL Slug", name: "alumni_slug", widget: "string", hint: "Must match a Featured Alumni entry's URL Slug above, to link this milestone to their profile." }
              - { label: "Detail", name: "note", widget: "string" }

          - label: "Alumni News"
            name: "news"
            widget: "list"
            summary: "{{headline}}"
            fields:
              - { label: "News Story Slug (used by 'Related News' above)", name: "slug", widget: "string" }
              - { label: "Headline", name: "headline", widget: "string" }
              - { label: "Summary", name: "summary", widget: "text" }
              - { label: "Date", name: "date", widget: "date" }
              - { label: "Alumnus URL Slug", name: "alumni_slug", widget: "string", required: false, hint: "Must match a Featured Alumni entry's URL Slug above, to link this story to their profile." }
              - { label: "Photo", name: "image", widget: "image", required: false }

          - label: "Advice to Future Participants (rotating quotes)"
            name: "quotes"
            widget: "list"
            summary: "{{quote}}"
            fields:
              - { label: "Quote", name: "quote", widget: "text" }
              - { label: "Attribution (e.g. Class of 2015)", name: "attribution", widget: "string" }

  - name: "classes"
    label: "Beaux — Legacy Archive"
    files:
      - file: "content/classes.json"
        label: "All Academy Classes"
        name: "classes"
        fields:
          - label: "Classes"
            name: "classes"
            widget: "list"
            summary: "{{year}} — {{theme}}"
            fields:
              - { label: "Class Year", name: "year", widget: "string" }
              - { label: "URL Slug (usually same as year)", name: "slug", widget: "string" }
              - { label: "Theme Name", name: "theme", widget: "string" }
              - { label: "Theme Quote", name: "quote", widget: "text" }
              - label: "Visual Style"
                name: "style"
                widget: "select"
                options: ["classic", "creme", "regal", "bold", "phoenix", "renaissance"]
              - { label: "Build the Full Class Page? (roster, honors, gallery)", name: "full_page", widget: "boolean", default: false }
              - { label: "Intro Paragraph (full page only)", name: "intro", widget: "text", required: false }
              - { label: "Theme Essay Title", name: "theme_essay_title", widget: "string", required: false }
              - { label: "Theme Essay Paragraphs", name: "theme_essay", widget: "list", field: { label: "Paragraph", name: "paragraph", widget: "text" }, required: false }
              - label: "Class Statistics"
                name: "stats"
                widget: "list"
                required: false
                summary: "{{label}}: {{value}}"
                fields:
                  - { label: "Label", name: "label", widget: "string" }
                  - { label: "Value", name: "value", widget: "string" }
              - { label: "Statistics Note", name: "stats_note", widget: "string", required: false }
              - label: "Class Honors"
                name: "honors"
                widget: "list"
                required: false
                summary: "{{title}} — {{recipient}}"
                fields:
                  - { label: "Award Title", name: "title", widget: "string" }
                  - { label: "Recipient Name", name: "recipient", widget: "string" }
                  - { label: "Significance", name: "significance", widget: "text" }
                  - { label: "Portrait", name: "photo", widget: "image", required: false }
                  - { label: "Portrait Description (shown until a photo is uploaded)", name: "photo_label", widget: "string" }
              - label: "Photo Gallery"
                name: "gallery"
                widget: "list"
                required: false
                summary: "{{caption}}"
                fields:
                  - { label: "Caption", name: "caption", widget: "string" }
                  - { label: "Photo", name: "image", widget: "image", required: false }
                  - { label: "Description (shown until a photo is uploaded)", name: "label", widget: "string" }
              - label: "Participants"
                name: "participants"
                widget: "list"
                required: false
                summary: "{{name}}"
                fields:
                  - { label: "Name", name: "name", widget: "string" }
                  - { label: "URL Slug (no spaces, e.g. john-smith)", name: "slug", widget: "string" }
                  - { label: "Headshot (large profile version)", name: "photo", widget: "image", required: false }
                  - { label: "Headshot (small directory-card version)", name: "card_photo", widget: "image", required: false, hint: "Used on the class photo grid. Leave the two headshot fields as-is for photos imported from the archive review -- only replace if you're uploading a brand-new photo." }
                  - { label: "Archival Original (do not edit)", name: "original_photo", widget: "image", required: false }
                  - { label: "Photo Alt Text (do not edit)", name: "alt", widget: "string", required: false }
                  - { label: "Profile Type (do not edit)", name: "profile_type", widget: "hidden", required: false }
                  - { label: "Hometown", name: "hometown", widget: "string", required: false }
                  - { label: "High School", name: "high_school", widget: "string", required: false }
                  - { label: "College", name: "college", widget: "string", required: false }
                  - { label: "Major", name: "major", widget: "string", required: false }
                  - { label: "Career Aspiration", name: "career", widget: "string", required: false }
                  - { label: "Leadership Activities", name: "activities", widget: "text", required: false }
                  - { label: "Community Service", name: "community_service", widget: "text", required: false }
                  - { label: "Awards / Honors", name: "honors", widget: "string", required: false }
                  - { label: "Short Biography", name: "bio", widget: "text", required: false }

  - name: "sponsors"
    label: "Sponsor Logo Wall"
    files:
      - file: "content/sponsors.json"
        label: "Sponsor Logo Wall (on the Support the Academy page)"
        name: "sponsors"
        fields:
          - label: "Recognition Tiers"
            name: "tiers"
            hint: "This only controls the 'Our Sponsors' logo wall lower on the Support the Academy page. The $50/$100/$250/$1,000 sponsorship levels and the sponsor form above it are fixed page content — ask Claude to change those."
            widget: "list"
            summary: "{{name}}"
            fields:
              - { label: "Tier Name (e.g. Platinum Sponsors)", name: "name", widget: "string" }
              - label: "Sponsors in This Tier"
                name: "sponsors"
                widget: "list"
                summary: "{{name}}"
                fields:
                  - { label: "Sponsor Name", name: "name", widget: "string" }
                  - { label: "Logo", name: "image", widget: "image", required: false }
                  - { label: "Text Shown Until a Logo Is Uploaded", name: "logo_label", widget: "string" }

  - name: "gallery"
    label: "Gallery"
    files:
      - file: "content/gallery.json"
        label: "Gallery Photos"
        name: "gallery"
        fields:
          - label: "Photos"
            name: "photos"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Caption", name: "caption", widget: "string" }
              - label: "Category"
                name: "category"
                widget: "select"
                options: ["ceremony", "program", "service", "sponsors"]
              - { label: "Photo", name: "image", widget: "image", required: false }
              - { label: "Text Shown Until a Photo Is Uploaded", name: "label", widget: "string" }

  - name: "site"
    label: "Site Settings"
    files:
      - file: "content/site.json"
        label: "Social Media Links"
        name: "site"
        fields:
          - label: "Social Media"
            name: "social"
            widget: "object"
            hint: "Full profile URLs (e.g. https://www.instagram.com/yourhandle/). These power every social icon and button across the site — header, footer, and homepage — so you only need to update them in one place."
            fields:
              - { label: "Instagram URL", name: "instagram", widget: "string" }
              - { label: "Facebook URL", name: "facebook", widget: "string" }
              - { label: "TikTok URL", name: "tiktok", widget: "string" }

  - name: "social_highlights"
    label: "Social Highlights"
    files:
      - file: "content/social-highlights.json"
        label: "Follow the Journey — Curated Posts"
        name: "social_highlights"
        fields:
          - label: "Posts"
            name: "highlights"
            widget: "list"
            summary: "{{platform}} — {{caption}}"
            hint: "These are the posts shown in the homepage 'Follow the Journey' section. Add posts by hand — this is never a live/scraped feed, so nothing appears here automatically. Do not add photos or details identifying a minor participant without a parent/guardian's consent, consistent with the program's photo release policy."
            fields:
              - { label: "Feature This Post? (shows larger, at the top)", name: "featured", widget: "boolean", default: false }
              - label: "Platform"
                name: "platform"
                widget: "select"
                options: ["instagram", "facebook", "tiktok"]
              - { label: "Caption", name: "caption", widget: "text" }
              - { label: "Date", name: "date", widget: "date" }
              - { label: "Link to the Original Post", name: "link", widget: "string" }
              - { label: "Photo / Video Thumbnail", name: "image", widget: "image", required: false }
              - { label: "Image Description (for accessibility, and shown until a photo is uploaded)", name: "alt", widget: "string" }
